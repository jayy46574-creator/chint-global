<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chint Global Login</title>
    <link rel="icon" type="image/jpeg" href="logo.jpeg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0f172a',
                            900: '#0a101d',
                        },
                        brandBlue: {
                            DEFAULT: '#1e40af',
                            hover: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
        <div class="flex justify-center mb-6">
            <img src="logo.jpeg" alt="Chint Global Logo" class="w-12 h-12 rounded-xl object-cover shadow-lg shadow-blue-500/30">
        </div>
        <h2 class="text-3xl font-bold mb-6 text-center text-slate-900">Welcome Back</h2>
        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" placeholder="Email Address"
                class="w-full bg-slate-50 border border-slate-300 p-4 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none text-slate-800 placeholder-slate-400">
            <input type="password" id="password" placeholder="Password"
                class="w-full bg-slate-50 border border-slate-300 p-4 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none text-slate-800 placeholder-slate-400">
            <button type="submit"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white p-4 rounded-xl font-bold transition-all shadow-md">Sign
                In</button>
        </form>
        <p class="mt-6 text-center text-slate-500 text-sm">Don't have an account? <a href="signup.html"
                class="text-blue-600 font-semibold hover:underline">Sign up</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('https://nexusplatform.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (data.success) {
                    alert("Login successful!");
                    // Add this line inside your login/signup success block
                    localStorage.setItem('currentUser', email);
                    window.location.href = 'dashboard.html'; // This redirects the browser
                } else {
                    alert("Login failed: " + data.message);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Could not connect to the server. Make sure node server.js is running!");
            }
        });
    </script>
</body>

</html>
